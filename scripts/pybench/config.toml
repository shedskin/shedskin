# Implementations and programs for pybench.py.
#
# Most implementations are built from a git ref (tag, branch or commit) of
# the repository named by their kind, and cached under the work directory by
# name and commit. An implementation with 'uses' runs another's build (e.g.
# the same CPython with its JIT switched on); one with 'exe' runs an
# installed interpreter instead of building one.

programs = ["adatron", "ant", "collatz", "mandelbrot", "oliva2", "path_tracing", "sieve", "voronoi"]

baseline = "CPython 3.15"   # speedups in the report are relative to this
timeout = 7200              # seconds per run

[runs]                      # reported time is the best of these
interpreter = 1             # several programs take minutes under CPython
compiled = 3

[repos]
cpython = "https://github.com/python/cpython"
pypy = "https://github.com/pypy/pypy"
shedskin = "https://github.com/shedskin/shedskin"
tpy = "https://github.com/trozen/tpy-lang"
tpy-examples = "https://github.com/trozen/tpy-examples"

# Extra Shed Skin flags for some programs, as their READMEs ask.
[shedskin_flags]
collatz = ["--int64"]       # its numbers don't fit in 32 bits

# Program sources. Interpreters and Shed Skin run the original programs;
# TurboPython runs its own ports of them.
[sources.python]
repo = "shedskin"
ref = "main"
path = "examples/{program}"

[sources.tpy]
repo = "tpy-examples"
ref = "main"
path = "shedskin/{program}"

# CPython. 'jit' names the LLVM major version that the JIT build needs;
# its bin directory must be on PATH, or listed in 'path'.

[[impl]]
name = "CPython 2.7"
kind = "cpython"
ref = "v2.7.18"
configure = ["CFLAGS=-std=gnu11"]   # GCC 15 defaults to C23, where bool is a keyword
# 2.7 trains PGO on nearly the whole test suite, which can hang (test_ftplib
# with OpenSSL 3); use the tests that Python 3's --pgo runs instead.
make = ["PROFILE_TASK=-m test.regrtest --pgo test_array test_base64 test_binascii test_binop test_bisect test_bytes test_bz2 test_cmath test_codecs test_collections test_complex test_datetime test_decimal test_dict test_difflib test_float test_functools test_generators test_hashlib test_heapq test_int test_itertools test_json test_list test_long test_math test_memoryview test_operator test_ordered_dict test_pickle test_pprint test_random test_re test_set test_sqlite test_string test_struct test_time test_tuple test_unicode test_xml_etree test_xml_etree_c"]

