name: tests

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

concurrency:
  group: environment-${{ github.ref }}
  cancel-in-progress: true

env:
  BUILD_TYPE: Release
  # extensions are compiled with -g, which makes ccache include the
  # (per-test) build directory in its hash: don't, so tests can share
  # their compiled library modules
  CCACHE_NOHASHDIR: 1

jobs:
  test:
    runs-on: ${{matrix.os}}
    # continue-on-error: true

    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macOS-latest, windows-latest]
        python-version: ["3.13"]
        # python: ["3.10", "3.11"]

    steps:
    - uses: actions/checkout@v4

    - uses: astral-sh/setup-uv@v5

    - name: Install shedskin
      run: uv sync --python ${{ matrix.python-version }}

    # ccache lets tests reuse the library modules compiled by earlier
    # tests (on windows, via a copy of ccache.exe named cl.exe, as cmake
    # ignores the compiler launcher with the visual studio generator)
    - name: Install ccache (linux)
      if: runner.os == 'Linux'
      run: sudo apt-get update && sudo apt-get install -y ccache

    - name: Install ccache (macos)
      if: runner.os == 'macOS'
      run: brew install ccache

    # put the real ccache.exe in PATH, before the chocolatey shim, as
    # ccache must see itself invoked as cl.exe
    - name: Install ccache (windows)
      if: runner.os == 'Windows'
      run: |
        choco install ccache -y --no-progress
        $ccache = Get-ChildItem "$env:ChocolateyInstall\lib\ccache" -Recurse -Filter ccache.exe | Select-Object -First 1
        if (-not $ccache) { throw "ccache.exe not found" }
        $ccache.DirectoryName | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
        & $ccache.FullName --version

    # on windows, /W4 repeats the same library warnings for every test
    # (~75k log lines, which makes the live log lag far behind, and
    # ccache replays them on cache hits): leave warnings to the other
    # platforms there
    - name: Test shedskin
      run: |
        cd tests
        uv run shedskin runtests --build-type Release --jobs 4 --ccache ${{ runner.os == 'Windows' && '--nowarnings' || '' }}

    - name: Test shedskin examples
      run: |
        cd examples
        uv run shedskin runtests --build-type Release --jobs 4 --ccache ${{ runner.os == 'Windows' && '--nowarnings' || '' }}

    - name: Show ccache statistics
      if: always()
      run: ccache --show-stats -v
